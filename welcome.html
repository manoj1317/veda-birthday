<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#0e0912"><title>A little surprise ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:'DM Sans',sans-serif;background:#0e0912;color:#fff;display:grid;place-items:center;position:relative}.scene{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(236,169,198,.24),transparent 24%),radial-gradient(circle at 20% 80%,rgba(180,70,125,.18),transparent 32%),radial-gradient(circle at 85% 20%,rgba(234,210,164,.1),transparent 28%);animation:scene 7s ease-in-out infinite alternate}.glow{position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,140,194,.16);filter:blur(45px);animation:glow 3s ease-in-out infinite}.heart{position:absolute;left:50%;top:50%;font-size:88px;color:#f3a8c8;text-shadow:0 0 25px rgba(236,169,198,.8),0 0 70px rgba(236,169,198,.45);transform:translate(-50%,-50%) scale(.25);animation:heart 3.8s cubic-bezier(.2,.8,.2,1) forwards}.particles{position:absolute;inset:0;pointer-events:none}.p{position:absolute;color:#f3bfd5;opacity:0;font-size:14px;animation:particle 3.8s ease-out forwards}.content{position:relative;text-align:center;z-index:2;opacity:0;animation:content 1.2s 2.3s ease forwards}.eyebrow{text-transform:uppercase;letter-spacing:.35em;font-size:10px;color:#ead2a4;margin-bottom:20px}.content h1{font-family:'Cormorant Garamond',serif;font-size:clamp(58px,11vw,105px);font-weight:400;line-height:.85;margin:0}.content h1 em{color:#eca9c6;font-style:italic}.content p{color:#c9b9c2;font-size:14px;letter-spacing:.06em;margin:25px 0 0}.enter{margin-top:34px;border:1px solid rgba(236,169,198,.45);background:rgba(236,169,198,.08);color:#f8dbe8;border-radius:999px;padding:13px 27px;font:500 12px 'DM Sans';letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:.3s}.enter:hover{background:rgba(236,169,198,.18);transform:translateY(-2px);box-shadow:0 10px 35px rgba(236,169,198,.15)}.fade{position:absolute;inset:0;background:#f3e8df;opacity:0;pointer-events:none;animation:fade 1.1s 4.5s ease forwards}
@keyframes heart{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}18%{opacity:1}48%{transform:translate(-50%,-50%) scale(1.18)}72%{transform:translate(-50%,-50%) scale(.98)}100%{transform:translate(-50%,-50%) scale(1)}}@keyframes content{to{opacity:1;transform:translateY(0)}}@keyframes particle{0%{opacity:0;transform:translate(0,0) scale(.4)}25%{opacity:.9}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.2)}}@keyframes glow{50%{transform:scale(1.25);opacity:.75}}@keyframes scene{to{filter:saturate(1.15);transform:scale(1.04)}}@keyframes fade{to{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important}}
</style></head>
<body><div class="scene"></div><div class="glow"></div><div class="heart">♥</div><div class="particles" id="particles"></div><div class="content"><div class="eyebrow">A little world made for you</div><h1>Welcome,<br><em>my Veda.</em></h1><p>Some beautiful things are worth taking a moment to enter.</p><button class="enter" id="enter">Enter your little universe ♡</button></div><div class="fade"></div>
<script>
const particles=document.getElementById('particles');for(let i=0;i<32;i++){const p=document.createElement('span');p.className='p';p.textContent=Math.random()>.35?'♡':'✦';p.style.left=Math.random()*100+'vw';p.style.top=(35+Math.random()*40)+'vh';p.style.setProperty('--x',(Math.random()*260-130)+'px');p.style.setProperty('--y',(-80-Math.random()*260)+'px');p.style.animationDelay=(1.2+Math.random()*2.5)+'s';particles.appendChild(p)}
function enter(){document.querySelector('.fade').style.animation='fade .9s ease forwards';setTimeout(()=>location.href='index.html',850)}
document.getElementById('enter').addEventListener('click',enter);setTimeout(enter,5200);
</script></body></html>
